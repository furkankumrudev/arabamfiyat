<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Türkiye ikinci el araç piyasa analizi" />
    <script>
      // Apply the saved or system theme before first paint so the page never flashes light.
      try {
        var saved = localStorage.getItem("arabamfiyat-theme");
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved
          : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (error) { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>ArabamFiyat.com | Piyasa Analizi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
