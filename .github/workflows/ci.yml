name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum; 3.12 is what the API container ships.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type-check and build
        run: npm run build
        working-directory: web

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build --file Dockerfile.api --tag arabamfiyat-api:ci .

      - name: Build web image
        run: docker build --file web/Dockerfile --tag arabamfiyat-web:ci .

      - name: Build single-container demo image
        run: docker build --file Dockerfile --tag arabamfiyat-demo:ci .
